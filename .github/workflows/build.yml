name: Build and Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            container: 'ubuntu:24.04'
            shell: bash
          - os: windows-latest
            container: null
            shell: pwsh
          - os: ubuntu-latest
            container: 'ubuntu:24.04'
            shell: bash
            qt: '6'
          - os: ubuntu-latest
            container: 'ubuntu:22.04'
            shell: bash
            qt: '5'

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt on Linux
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y software-properties-common
          add-apt-repository universe || true
          apt-get update
          apt-get install -y build-essential zlib1g-dev
          apt-get install -y qt6-base-dev qt6-tools-dev qt6-qtxml-dev
          - name: Install Qt 6 on Linux
            if: runner.os == 'Linux' && matrix.qt == '6'
            run: |
              apt-get update
              apt-get install -y software-properties-common
              add-apt-repository universe || true
              apt-get update
              apt-get install -y build-essential zlib1g-dev
              apt-get install -y qt6-base-dev qt6-tools-dev qt6-qtxml-dev

          - name: Install Qt 5 on Linux
            if: runner.os == 'Linux' && matrix.qt == '5'
            run: |
              apt-get update
              apt-get install -y build-essential zlib1g-dev
              apt-get install -y qtbase5-dev qttools5-dev-tools libqt5xml5-dev qt5-qmake

      - name: Install Qt on Windows
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Run qmake on Linux
        if: runner.os == 'Linux'
        working-directory: ivef-sdk
        run: |
          qmake6
          - name: Create build directory
            if: runner.os == 'Linux'
            run: mkdir -p build

          - name: Run qmake for Qt6 on Linux
            if: runner.os == 'Linux' && matrix.qt == '6'
            working-directory: build
            run: |
              qmake6 -v
              qmake6

          - name: Run qmake for Qt5 on Linux
            if: runner.os == 'Linux' && matrix.qt == '5'
            working-directory: build
            run: |
              qmake -v
              qmake

      - name: Run qmake on Windows
        if: runner.os == 'Windows'
        working-directory: ivef-sdk
        run: |
          qmake -v
          qmake

      - name: Build project on Linux
        if: runner.os == 'Linux'
        working-directory: build
        run: |
          make -j$(nproc)

      - name: Build project on Windows
        if: runner.os == 'Windows'
        working-directory: build
        run: |
          nmake

      - name: Run Qt tests on Linux
        if: runner.os == 'Linux'
        working-directory: ivef-sdk/tests/codes
        run: |
          ./run_all_tests.sh || true

      - name: Verify examples built
        if: runner.os == 'Linux'
        working-directory: build
        run: |
          ls -la targets/ilisten || echo "ilisten example not found"
          ls -la targets/isim || echo "isim example not found"
