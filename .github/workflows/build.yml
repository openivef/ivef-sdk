name: Build and Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            container: null
            shell: pwsh
          - os: ubuntu-latest
            container: 'ubuntu:24.04'
            shell: bash
            qt: '6'
          - os: ubuntu-latest
            container: 'ubuntu:22.04'
            shell: bash
            qt: '5'

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt 6 on Linux
        if: runner.os == 'Linux' && matrix.qt == '6'
        run: |
          apt-get update
          apt-get install -y build-essential zlib1g-dev
          apt-get install -y qt6-base-dev qt6-tools-dev qt6-5compat-dev

      - name: Install Qt 5 on Linux
        if: runner.os == 'Linux' && matrix.qt == '5'
        run: |
          ln -snf /usr/share/zoneinfo/$CONTAINER_TIMEZONE /etc/localtime && echo $CONTAINER_TIMEZONE > /etc/timezone
          apt-get update
          apt-get install -y build-essential zlib1g-dev
          apt-get install -y qtbase5-dev qttools5-dev-tools qt5-qmake

      - name: Install Qt on Windows
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Setup MSVC and build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build
          $vs = &"$env:ProgramFiles(x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { Write-Error 'Visual Studio not found'; exit 1 }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          cmd /c "\"$vcvars\" x64 && qmake -v && qmake ..\ivef-sdk && nmake"

      - name: Run qmake and build on Linux (Qt6)
        if: runner.os == 'Linux' && matrix.qt == '6'
        working-directory: ivef-sdk
        run: |
          qmake6 -v
          qmake6
          make -j$(nproc)

      - name: Run qmake and build on Linux (Qt5)
        if: runner.os == 'Linux' && matrix.qt == '5'
        working-directory: ivef-sdk
        run: |
          qmake -v
          qmake
          make -j$(nproc)

      - name: Run qmake on Windows
        if: runner.os == 'Windows'
        working-directory: ivef-sdk
        run: |
          qmake -v
          qmake

      - name: Run Qt tests on Linux
        if: runner.os == 'Linux'
        working-directory: ivef-sdk/tests/codes
        run: |
          ./run_all_tests.sh || true

      - name: Verify example ilisten built
        if: runner.os == 'Linux'
        working-directory: ivef-sdk/build/examples
        run: |
          ./run_ilisten --help || echo "ilisten cannot run"
